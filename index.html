<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能一体化全屏刷题看板 - 答题中心</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="fullscreen-container">
      <header class="main-header">
        <div class="header-left">
          <h1>🧠 智能一体化高对比刷题系统</h1>
          <div class="nav-tabs">
            <a href="index.html" class="tab-btn active">📝 今日刷题</a>
            <a href="analysis.html" class="tab-btn">📊 数据分析与艾宾浩斯复习</a>
          </div>
        </div>
        <div class="header-controls">
          <div
            class="mode-switch-wrapper"
            id="modeSwitchBox"
            style="display: flex"
          >
            <span class="mode-label">单题模式</span>
            <label class="switch">
              <input type="checkbox" id="modeToggle" />
              <span class="slider round"></span>
            </label>
            <span class="mode-label">全卷模式</span>
          </div>
          <button id="themeToggleBtn" class="theme-toggle-btn" title="切换主题">
            <span class="icon">🌙</span>
          </button>
        </div>
      </header>

      <div class="main-layout tab-content active" id="quizTab">
        <div class="card quiz-zone" id="quizZone">
          <div class="progress-bar-container" id="progressContainer">
            <div class="progress-bar" id="progressBar"></div>
          </div>
          <div class="quiz-header" id="quizHeader">
            <span id="quizIndex">题目：0 / 0</span>
            <span id="wordStage" class="badge">熟练度: L0</span>
          </div>

          <div id="quizDynamicContent" class="quiz-dynamic-content">
            <div class="word-display" id="wordDisplay">
              请在右侧上传一体化题库文件即可开始...
            </div>
            <div class="options-grid" id="optionsGrid"></div>
            <div id="feedback" class="feedback-msg"></div>
          </div>

          <button id="nextBtn" class="success-btn" style="display: none">
            下一题
          </button>
        </div>

        <div class="right-panel">
          <div class="card upload-section">
            <h3>📂 题库导入与备份</h3>
            <div class="file-upload-wrapper">
              <label for="vocabFile" class="custom-file-upload">
                <span class="upload-icon">📁</span>
                <div class="upload-text">
                  <strong id="fileStatusText">选择或拖拽题库文件</strong>
                  <small>支持一体化标准 .txt 格式</small>
                </div>
              </label>
              <input
                type="file"
                id="vocabFile"
                accept=".txt"
                style="display: none"
              />
            </div>
            <div class="action-btn-group">
              <button id="exportWrongBtn" class="export-btn" disabled>
                📥 导出当前错题集
              </button>
            </div>
          </div>

          <div
            class="card answer-card-zone"
            id="answerCardZone"
            style="opacity: 0.4; pointer-events: none"
          >
            <h3>🎯 答题卡快速跳转</h3>
            <div class="answer-card-grid" id="answerCardGrid">
              <div
                style="
                  color: var(--text-muted);
                  font-size: 13px;
                  text-align: center;
                  grid-column: 1/-1;
                "
              >
                暂无数据
              </div>
            </div>
          </div>

          <div
            class="card dashboard-zone"
            id="dashboardZone"
            style="opacity: 0.4; pointer-events: none"
          >
            <h3>📋 简易题库快览</h3>
            <div class="table-wrapper">
              <table>
                <thead>
                  <tr>
                    <th>序号</th>
                    <th>题目摘要</th>
                    <th>标准答案</th>
                    <th>错误</th>
                    <th>熟练度</th>
                  </tr>
                </thead>
                <tbody id="dashboardBody">
                  <tr>
                    <td
                      colspan="5"
                      style="text-align: center; color: var(--text-muted)"
                    >
                      暂无数据
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
